# Fully offline deployment. No cloud dependency, no outbound network.
#
# Images and the Ollama model are NEVER pulled from inside the air-gapped
# environment. They are pulled, scanned, signed and verified on a connected
# staging machine, then carried across on approved media:
#
#   CONNECTED STAGING  ->  pull + scan + verify  ->  sign (SHA-256 + gpg)
#     ->  approved removable media  ->  AIR-GAPPED  ->  verify hash+signature
#     ->  import verified images  ->  run completely offline
#
# Load transferred images with:  docker load -i trinetra-images.tar

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: trinetra
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: trinetra
    volumes: ["pgdata:/var/lib/postgresql/data"]
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme}
    volumes: ["neo4jdata:/data"]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    volumes: ["ollamadata:/root/.ollama"]
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    volumes: ["clamdata:/var/lib/clamav"]
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on: [postgres, neo4j, redis, ollama]
    environment:
      ENV: airgapped
      DEBUG: "false"
      DATABASE_URL: postgresql://trinetra:${DB_PASSWORD:-changeme}@postgres:5432/trinetra
      DATABASE_DIRECT_URL: postgresql://trinetra:${DB_PASSWORD:-changeme}@postgres:5432/trinetra
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ollama                 # <- the entire AI layer swaps here
      OLLAMA_BASE_URL: http://ollama:11434
      CLAMAV_ENABLED: "true"
      CLAMAV_HOST: clamav
      WHISPER_ENABLED: "true"
      ALLOWED_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    restart: unless-stopped

  worker:
    build: ./backend
    depends_on: [backend, redis]
    command: celery -A app.workers.celery_app worker --beat --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql://trinetra:${DB_PASSWORD:-changeme}@postgres:5432/trinetra
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3000:3000"]
    restart: unless-stopped

volumes:
  pgdata:
  neo4jdata:
  ollamadata:
  clamdata:
